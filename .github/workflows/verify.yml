name: Automated Code Quality & Detekt Check

# Triggers for the workflow
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  detekt-analysis:
    name: Run Detekt Static Analysis
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout project code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 environment on the runner
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Download Detekt CLI executable and run static code analysis
      - name: Download & Run Detekt CLI
        run: |
          curl -sSL https://github.com/detekt/detekt/releases/download/v1.23.5/detekt-cli-1.23.5-all.jar -o detekt.jar
          java -jar detekt.jar --config config/detekt/detekt.yml --build-upon-default-config --input .